
<aside
  id="app-sidebar"
  class="sidebar"
  [attr.aria-label]="isSuperMaintenance
    ? 'Super Maintenance navigation'
    : 'Owner navigation'">

  <!-- Brand -->
  <header class="sidebar-header">
    <div class="brand-icon">
      <span>PG</span>
    </div>

    <div class="brand-text">
      <div class="brand-title-row">
        <h2>PG Manager</h2>
        <span class="brand-badge">PRO</span>
      </div>

      <span class="brand-subtitle">
        {{ isSuperMaintenance ? 'Operations Console' : 'Management System' }}
      </span>
    </div>
  </header>

  <!-- Current role -->
  <div class="role-panel">
    <div class="role-avatar">
      <svg
        *ngIf="!isSuperMaintenance"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor">
        <path
          d="M12 3l8 3v5c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-3z"
          stroke-width="1.8"
          stroke-linejoin="round"/>
        <path
          d="M8.5 12l2.2 2.2 4.8-5"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>
      </svg>

      <svg
        *ngIf="isSuperMaintenance"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor">
        <path
          d="M14.5 6.5a5 5 0 00-6.3 6.3L3 18l3 3 5.2-5.2a5 5 0 006.3-6.3L14 13l-3-3 3.5-3.5z"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="role-info">
      <span class="role-label">SIGNED IN AS</span>
      <strong>
        {{ isSuperMaintenance ? 'Super Maintenance' : 'Owner / Admin' }}
      </strong>
    </div>

    <span class="role-dot"></span>
  </div>

  <!-- Navigation -->
  <nav class="navigation">
    <p class="section-title">
      {{ isSuperMaintenance ? 'OPERATIONS' : 'MAIN MENU' }}
    </p>

    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      #activeRoute="routerLinkActive"
      [routerLinkActiveOptions]="{
        exact: item.route === '/dashboard'
      }"
      class="nav-item"
      [attr.aria-current]="activeRoute.isActive ? 'page' : null">

      <span class="nav-icon" aria-hidden="true">

        <!-- Dashboard -->
        <svg
          *ngIf="item.icon === 'dashboard'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">
          <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
          <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
          <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
          <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
        </svg>

        <!-- Properties -->
        <svg
          *ngIf="item.icon === 'building'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">
          <path d="M3 21h18M5 21V5a2 2 0 012-2h10a2 2 0 012 2v16"/>
          <path d="M9 7h2m2 0h2M9 11h2m2 0h2M9 15h2m2 0h2M10 21v-3h4v3"/>
        </svg>

        <!-- Rooms and beds -->
        <svg
          *ngIf="item.icon === 'beds'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">
          <path d="M3 12V5m0 11v3m18-7V5m0 11v3M3 16h18"/>
          <path d="M3 12h18v4H3zM7 12V9a2 2 0 012-2h2a2 2 0 012 2v3"/>
        </svg>

        <!-- Tenants -->
        <svg
          *ngIf="item.icon === 'users'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">
          <path d="M16 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="10" cy="7" r="4"/>
          <path d="M20 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
        </svg>

        <!-- Rent -->
        <svg
          *ngIf="item.icon === 'wallet'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">
          <rect x="3" y="5" width="18" height="15" rx="2"/>
          <path d="M3 9h18m-5 5h1M7 5V3h11"/>
        </svg>

        <!-- Notifications -->
        <svg
          *ngIf="item.icon === 'bell'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">
          <path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
          <path d="M10 21h4"/>
        </svg>

        <!-- Profile -->
        <svg
          *ngIf="item.icon === 'profile'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21a8 8 0 0116 0"/>
        </svg>

        <!-- Account control -->
        <svg
          *ngIf="item.icon === 'shield'"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor">
          <path d="M12 3l8 3v5c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-3z"/>
          <path d="M12 8v4m0 4h.01"/>
        </svg>
      </span>

      <span class="nav-label">{{ item.label }}</span>

      <!-- Uses RouterLinkActive, not the private Router service -->
      <svg
        *ngIf="activeRoute.isActive"
        class="nav-chevron"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        aria-hidden="true">
        <path
          d="M9 18l6-6-6-6"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"/>
      </svg>
    </a>
  </nav>

  <!-- Bottom section -->
  <div class="sidebar-bottom">
    <div class="support-box">
      <div class="support-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="9"/>
          <path d="M9.5 9a2.5 2.5 0 014.5 1.5c0 1.5-2 2-2 3.5m0 3h.01"/>
        </svg>
      </div>

      <div class="support-text">
        <strong>Need Help?</strong>
        <span>Contact support</span>
      </div>
    </div>

    <button
      type="button"
      class="logout-button"
      (click)="logout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
        <path
          d="M10 17l5-5-5-5m5 5H3"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>
        <path
          d="M12 3h6a2 2 0 012 2v14a2 2 0 01-2 2h-6"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"/>
      </svg>
      <span>Logout</span>
    </button>

    <p class="sidebar-version">PG Manager · Management System</p>
  </div>
</aside>
