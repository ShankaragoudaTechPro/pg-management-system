<div class="min-h-full bg-[#f6f8fc]">

  <!-- Header -->
  <div
    class="mb-6 flex flex-col gap-4 sm:mb-8 lg:flex-row lg:items-end lg:justify-between">

    <div>

      <button
        type="button"
        (click)="cancel()"
        class="mb-3 inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 transition hover:text-slate-900">

        <span class="material-symbols-outlined text-[18px]">
          arrow_back
        </span>

        Back to Dashboard

      </button>

      <p
        class="text-[11px] font-bold uppercase tracking-[0.14em] text-blue-600 sm:text-xs">
        PG MANAGEMENT
      </p>

      <h1
        class="mt-1 text-[28px] font-extrabold tracking-tight text-[#12233f] sm:text-3xl">
        Add PG Property
      </h1>

      <p
        class="mt-1 text-sm leading-6 text-slate-500">
        Add the property information required to start managing your PG.
      </p>

    </div>

  </div>


  <!-- Messages -->
  @if (successMessage) {

    <div
      class="mb-5 flex items-start gap-3 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700">

      <span class="material-symbols-outlined text-[20px]">
        check_circle
      </span>

      <span>
        {{ successMessage }}
      </span>

    </div>

  }


  @if (errorMessage) {

    <div
      class="mb-5 flex items-start gap-3 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">

      <span class="material-symbols-outlined text-[20px]">
        error
      </span>

      <span>
        {{ errorMessage }}
      </span>

    </div>

  }


  <!-- Main Form -->
  <form
    (ngSubmit)="savePg()"
    class="mx-auto max-w-5xl">

    <div class="grid grid-cols-1 gap-6">


      <!-- Main Information -->
      <section
        class="rounded-2xl border border-slate-200 bg-white shadow-sm">

        <div class="border-b border-slate-100 px-5 py-4 sm:px-6">

          <div class="flex items-center gap-3">

            <div
              class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-50 text-blue-600">

              <span class="material-symbols-outlined">
                apartment
              </span>

            </div>

            <div>

              <h2 class="text-base font-bold text-[#12233f]">
                Property Information
              </h2>

              <p class="mt-0.5 text-xs text-slate-500">
                Basic information about your PG property.
              </p>

            </div>

          </div>

        </div>


        <div class="space-y-5 p-5 sm:p-6">

          <!-- PG Name -->
          <div>

            <label
              for="pgName"
              class="mb-1.5 block text-xs font-semibold text-slate-700">
              PG Name *
            </label>

            <input
              id="pgName"
              name="pgName"
              type="text"
              [(ngModel)]="pgForm.name"
              placeholder="Enter PG name"
              required
              class="h-12 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/15" />

          </div>


          <!-- Type -->
          <div>

            <label
              for="pgType"
              class="mb-1.5 block text-xs font-semibold text-slate-700">
              PG Type *
            </label>

            <select
              id="pgType"
              name="pgType"
              [(ngModel)]="pgForm.type"
              required
              class="h-12 w-full rounded-xl border border-slate-200 bg-slate-50 px-4 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/15">
              <option value="" disabled>Select PG type</option>
              <option value="GENTS">Gents PG</option>
              <option value="LADIES">Ladies PG</option>
              <option value="COLIVING">Co-living</option>
            </select>

          </div>


          <!-- Description -->
          <div>

            <label
              for="description"
              class="mb-1.5 block text-xs font-semibold text-slate-700">
              Description
            </label>

            <textarea
              id="description"
              name="description"
              [(ngModel)]="pgForm.description"
              rows="5"
              placeholder="Enter a short description of the PG property"
              class="w-full resize-none rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/15"></textarea>

          </div>

        </div>

      </section>


    </div>


    <!-- Actions -->
    <div
      class="mt-6 flex flex-col-reverse gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:flex-row sm:items-center sm:justify-end sm:p-5">

      <button
        type="button"
        (click)="cancel()"
        [disabled]="saving"
        class="h-11 w-full rounded-xl border border-slate-200 px-5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto">

        Cancel

      </button>


      <button
        type="submit"
        [disabled]="saving"
        class="flex h-11 w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-6 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60 sm:w-auto">

        @if (saving) {

          <span class="material-symbols-outlined animate-spin text-[18px]">
            progress_activity
          </span>

          Creating...

        } @else {

          <span class="material-symbols-outlined text-[18px]">
            add_business
          </span>

          Create PG

        }

      </button>

    </div>

  </form>

</div>
