<div class="min-h-[100svh] bg-[#f8f9ff] px-4 py-6 sm:px-6 lg:px-8">

  <div class="flex min-h-[calc(100svh-3rem)] items-center justify-center">

    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-xl sm:p-8">

      <!-- Logo -->
      <div class="flex items-center gap-3">

        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#004ac6] text-white">
          <span class="material-symbols-outlined">
            apartment
          </span>
        </div>

        <div>
          <p class="text-base font-bold text-slate-900">
            PG Manager
          </p>

          <p class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">
            Owner Portal
          </p>
        </div>

      </div>


      <!-- Heading -->
      <div class="mt-8">

        <h1 class="text-2xl font-bold tracking-tight text-slate-900">
          Forgot Password?
        </h1>

        <p class="mt-2 text-sm leading-6 text-slate-500">
          Enter your registered mobile number to continue with password recovery.
        </p>

      </div>


      <!-- Error -->
      @if (errorMessage) {

        <div
          class="mt-5 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">

          {{ errorMessage }}

        </div>

      }


      <!-- Form -->
      <form
        class="mt-7 space-y-5"
        (ngSubmit)="sendOtp()">

        <div>

          <label
            for="mobile"
            class="mb-2 block text-xs font-semibold text-slate-700">
            Registered Mobile Number
          </label>

          <div class="relative">

            <span
              class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[19px] text-slate-400">
              phone
            </span>

            <input
              id="mobile"
              name="mobile"
              type="tel"
              [(ngModel)]="mobile"
              placeholder="+91 XXXXX XXXXX"
              autocomplete="tel"
              required
              class="h-12 w-full rounded-xl border border-slate-200 bg-slate-50 pl-10 pr-4 text-sm text-slate-900 outline-none transition focus:border-[#004ac6] focus:bg-white focus:ring-2 focus:ring-[#004ac6]/20" />

          </div>

        </div>


        <button
          type="submit"
          [disabled]="loading"
          class="flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-[#2563eb] text-sm font-semibold text-white transition hover:bg-[#004ac6] disabled:cursor-not-allowed disabled:opacity-70">

          @if (loading) {

            <span class="material-symbols-outlined animate-spin">
              progress_activity
            </span>

            Sending...

          } @else {

            <span>
              Send OTP
            </span>

            <span class="material-symbols-outlined text-[18px]">
              arrow_forward
            </span>

          }

        </button>

      </form>


      <!-- Back -->
      <button
        type="button"
        (click)="backToLogin()"
        class="mt-6 flex w-full items-center justify-center gap-1.5 text-sm font-semibold text-[#004ac6] hover:underline">

        <span class="material-symbols-outlined text-[18px]">
          arrow_back
        </span>

        Back to Login

      </button>

    </div>

  </div>

</div>
